name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Execute Tests
      run: dotnet test test/UnitTests/UnitTests.csproj --no-restore --configuration Release --verbosity normal

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate Coverage Report
      run: |
        dotnet test test/UnitTests/UnitTests.csproj --configuration Release \
        /p:CollectCoverage=true \
        /p:CoverletOutputFormat=opencover \
        /p:Threshold=97 \
        /p:ThresholdType=line \
        /p:Include=\"[Howestprime.Movies.Application]*,[Howestprime.Movies.Domain]*\"

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: "**/coverage.opencover.xml"

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: echo ${{ secrets.howestprime_wide_ci_service_principal_password }} | docker login ${{ vars.az_container_registry }} -u ${{ secrets.howestprime_wide_ci_service_principal }} --password-stdin

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish .NET app
        run: dotnet publish -c Release -p:PublishProfile=production -p:ContainerRegistry=${{ vars.az_container_registry }} -p:ContainerImageTag=1.0.0 /t:PublishContainer

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        run: az login --service-principal -u ${{ secrets.howestprime_wide_ci_service_principal }} -p ${{ secrets.howestprime_wide_ci_service_principal_password }} --tenant ${{ vars.az_tenant_id }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
          --name microservice-movies \
          --resource-group ${{ vars.az_resource_group }} \
          --environment ${{ vars.az_container_environment }} \
          --image ${{ vars.az_container_registry }}/microservice-movies:1.0.0 \
          --registry-server ${{ vars.az_container_registry }} \
          --registry-username ${{ secrets.howestprime_wide_ci_service_principal }} \
          --registry-password ${{ secrets.howestprime_wide_ci_service_principal_password }} \
          --user-assigned "${{ vars.howestprime_wide_mi_keyvaultreader_id }}" \
          \
          --secrets \
          "db-password=keyvaultref:${{vars.howestprime_movies_p_psql_password_uri}},identityref:${{vars.howestprime_wide_mi_keyvaultreader_id}}" \
          "mb-password=keyvaultref:${{vars.howestprime_wide_p_messagebroker_password_uri}},identityref:${{vars.howestprime_wide_mi_keyvaultreader_id}}" \
          \
          --env-vars \
          ASPNETCORE_ENVIRONMENT=Production \
          "Database__Password=secretref:db-password" \
          "Database__Username=${{vars.howestprime_movies_p_psql_login}}" \
          "Database__ConnectionString=${{vars.howestprime_movies_p_psql_connection_string}}" \
          "MessageBroker__Hostname=${{vars.howestprime_wide_p_messagebroker_hostname}}" \
          "MessageBroker__VirtualHost=${{vars.howestprime_wide_p_messagebroker_vhost}}" \
          "MessageBroker__Password=secretref:mb-password" \
          "MessageBroker__Username=${{vars.howestprime_wide_p_messagebroker_login}}" 
          
          az containerapp ingress enable \
          --name microservice-movies \
          --resource-group ${{ vars.az_resource_group }} \
          --type external \
          --target-port 8000